services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "54321:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d user_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    build: ./user-db
    depends_on:
      db:
        condition: service_healthy
    command: >
      --url=jdbc:postgresql://db:5432/user_db
      --username=admin
      --password=password
      --changelog-file=db/database-changelog.xml
      update

  app:
    build: ./user-impl
    ports:
      - "9000:8070"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/user_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      liquibase:
        condition: service_completed_successfully